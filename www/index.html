<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2c3e50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LGF Grocery">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>La Gran Familia Grocery Corp.</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app">

  <header>
    <div class="header-inner">
      <div class="logo" onclick="App.nav('dashboard')">
        <span class="logo-icon">💰</span>
        <span class="logo-text">La Gran Familia<span class="logo-sub">Grocery Corp.</span></span>
      </div>
      <button class="hamburger" onclick="App.toggleNav()">☰</button>
    </div>
  </header>

  <div id="navOverlay" class="nav-overlay" onclick="App.closeNav()"></div>
  <nav id="navDrawer" class="nav-drawer">
    <div class="nav-drawer-header">
      <div class="logo-text">La Gran Familia<span class="logo-sub">Grocery Corp.</span></div>
    </div>
    <a class="nav-link active" data-page="dashboard"   onclick="App.nav('dashboard')"><span class="nav-icon">🏠</span><span data-t="dashboard">Dashboard</span></a>
    <a class="nav-link" data-page="revenue"            onclick="App.nav('revenue')"><span class="nav-icon">💵</span><span data-t="revenue">Revenue</span></a>
    <a class="nav-link" data-page="expenses"           onclick="App.nav('expenses')"><span class="nav-icon">🧾</span><span data-t="expenses">Expenses</span></a>
    <a class="nav-link" data-page="merchandise"        onclick="App.nav('merchandise')"><span class="nav-icon">🛍️</span><span data-t="merchandise">Merchandise</span></a>
    <a class="nav-link" data-page="employees"          onclick="App.nav('employees')"><span class="nav-icon">👥</span><span data-t="employees">Employees</span></a>
    <a class="nav-link" data-page="reports"            onclick="App.nav('reports')"><span class="nav-icon">📊</span><span data-t="reports">Reports</span></a>
    <a class="nav-link" data-page="settings"           onclick="App.nav('settings')"><span class="nav-icon">⚙️</span><span data-t="settings">Settings</span></a>
  </nav>

  <div id="pageContainer"></div>
  <div id="offlineBanner">You're offline — showing saved data</div>

</div>

<script src="js/db.js"></script>
<script src="js/translations.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/revenue.js"></script>
<script src="js/pages/expenses.js"></script>
<script src="js/pages/merchandise.js"></script>
<script src="js/pages/employees.js"></script>
<script src="js/pages/reports.js"></script>
<script src="js/pages/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
